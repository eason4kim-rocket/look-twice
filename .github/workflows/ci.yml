name: cpu-contract-tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade numpy pillow
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.9.1
      - name: Build Purify core for Python integration tests
        working-directory: purify_robotics
        run: |
          mkdir -p bin
          go build -trimpath -o bin/purify-robotics-core ./cmd/purify-robotics-core
      - name: Run Python test suite
        run: python -m unittest discover -s tests -v
      - name: Verify immutable frozen foundation at its tagged source
        run: |
          git worktree add --detach ../look-twice-frozen v8-competition-final-2026-08-05
          cd ../look-twice-frozen
          python scripts/verify_frozen_foundation.py
          python -m unittest tests.test_verify_v8_frozen_challenge -v

  purify-reference-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: purify_robotics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - name: Test reference core
        run: go test ./...
      - name: Build Linux AMD64 binary
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags="-s -w" -o ../purify-robotics-core-linux-amd64 ./cmd/purify-robotics-core
      - name: Record checksum
        working-directory: .
        run: sha256sum purify-robotics-core-linux-amd64

  showcase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: showcase/package-lock.json
      - name: Install showcase dependencies
        working-directory: showcase
        run: npm ci
      - name: Verify replay data and production build
        run: |
          python3 scripts/build_competition_replays.py
          cd showcase
          npm test
